<!DOCTYPE html>
<html lang="zh-CN" data-page="subscribe">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-eU8Bk4yT5FPiStrfNBsD2oFPBgN4VUk+BA3IJMTtDm4=' https://static.cloudflareinsights.com; script-src-attr 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F1110" />
  <title>订阅更新 · AI Radar</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./assets/radar.css" />
  <link rel="alternate" type="application/rss+xml" title="AI Radar 全部更新" href="./feed.xml" />
</head>
<body>
  <div class="app">
    <script src="./assets/safe-href.js"></script>
    <script src="./assets/shell.js"></script>
    <div class="content">
      <main id="main">
        <h1>订阅更新</h1>
        <p class="sub">用 RSS 阅读器订阅 AI Radar 的更新。分册按用途分成试用工具、行业动态、方法模式、时机窗口，你可以挑要订哪几份。</p>
        <ul class="feed-list" id="feeds"></ul>
        <div class="link-row join-row">
          <div>
            <strong>飞书订阅群</strong>
            <span>上面的 RSS 是主要订阅方式。没有阅读器时，加入飞书群即可接收更新，本站不记录订阅名单。</span>
          </div>
          <div class="feed-actions">
            <a class="btn" href="https://applink.feishu.cn/client/chat/chatter/add_by_link?link_token=e42k2f97-3894-42e8-af5a-68296c32ff83" target="_blank" rel="noopener noreferrer">加入订阅群</a>
          </div>
        </div>
        <footer class="site-footer">
          <p>内容可能包含未经证实的传闻与第三方帖子，请自行核对。</p>
          <p>更正与下架：请通过「<a href="https://my.feishu.cn/share/base/form/shrcnEpIGDXepmIOFwMD8QUARwd" target="_blank" rel="noopener noreferrer">反馈 / 建议</a>」告知。</p>
        </footer>
      </main>
    </div>
  </div>
  <script>
    const feeds = [
      ["全部更新", "每天两次的信号都在这一份。", "./feed.xml"],
      ["试用工具", "只收能试用、能接进流程的。", "./feeds/lens-tools.xml"],
      ["行业动态", "谁在发布、融资、换赛道。", "./feeds/lens-tracks.xml"],
      ["方法模式", "做事方式和交付形态的变化。", "./feeds/lens-models.xml"],
      ["时机窗口", "窗口打开或关上的时候。", "./feeds/lens-timing.xml"]
    ];

    const host = document.getElementById("feeds");
    host.innerHTML = feeds.map(([title, desc, href]) => {
      const safe = safeHref(href);
      if (!safe) return "";
      const hrefAttr = safe.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
      return `
      <li>
        <div>
          <strong>${title}</strong>
          <span>${desc}</span>
        </div>
        <div class="feed-actions">
          <a href="${hrefAttr}">打开</a>
          <button class="btn" type="button" data-copy="${hrefAttr}">复制地址</button>
        </div>
      </li>
    `;
    }).join("");

    host.addEventListener("click", async (event) => {
      const btn = event.target.closest("[data-copy]");
      if (!btn) return;
      const absolute = new URL(btn.dataset.copy, location.href).href;
      try {
        await navigator.clipboard.writeText(absolute);
        btn.textContent = "已复制";
        btn.classList.add("done");
      } catch (err) {
        btn.textContent = absolute;
      }
      setTimeout(() => {
        btn.textContent = "复制地址";
        btn.classList.remove("done");
      }, 1800);
    });
  </script>
</body>
</html>
