<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Radar · 时间线</title>
  <link rel="alternate" type="application/rss+xml" title="AI Radar RSS" href="./feed.xml" />
  <style>
    :root {
      --bg: #0b0f14;
      --card: #141a22;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --line: #243041;
      --accent: #5b9fd4;
      --p0: #e85d4c;
      --obj: #3a4a5c;
      --judge: #c4892a;
      --judge-bg: rgba(196, 137, 42, 0.08);
      --sticky: rgba(11, 15, 20, 0.92);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, var(--bg) 55%);
      color: var(--text); line-height: 1.55; min-height: 100vh;
    }
    header { max-width: 760px; margin: 0 auto; padding: 28px 20px 8px; }
    h1 { font-size: 1.5rem; font-weight: 650; margin: 0 0 6px; letter-spacing: 0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; }
    .note {
      margin-top: 10px; font-size: 0.82rem; color: var(--muted);
      background: #101820; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chip {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer;
    }
    .chip.active { color: var(--text); border-color: var(--accent); background: #182536; }
    .day-nav {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center;
    }
    .day-nav label { font-size: 0.8rem; color: var(--muted); }
    .day-nav select {
      background: #101820; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 10px; font-size: 0.85rem;
    }
    main { max-width: 760px; margin: 0 auto; padding: 4px 20px 48px; }
    .day-block { margin-top: 8px; }
    .day-header {
      position: sticky; top: 0; z-index: 5;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: var(--sticky); border-bottom: 1px solid var(--line);
      padding: 12px 4px 8px; margin: 0 -4px 4px; font-weight: 650; font-size: 0.95rem;
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    }
    .day-header .count { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; margin: 12px 0; border-left: 3px solid var(--accent);
    }
    .card.p0 { border-left-color: var(--p0); }
    .tag {
      display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 6px; background: #1c2736; color: var(--accent); margin-right: 6px;
    }
    .tag.p0 { color: var(--p0); }
    .title { font-size: 1.02rem; font-weight: 600; margin: 8px 0; }
    .section { margin-top: 10px; }
    .section-label {
      font-size: 0.72rem; font-weight: 650; letter-spacing: 0.06em;
      color: var(--muted); text-transform: none; margin-bottom: 4px;
    }
    .objective {
      border-left: 2px solid var(--obj); padding-left: 10px;
    }
    .judgment {
      margin-top: 10px; border: 1px solid rgba(196, 137, 42, 0.45);
      background: var(--judge-bg); border-radius: 10px; padding: 10px 12px;
    }
    .judgment .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      color: #1a1408; background: var(--judge); border-radius: 6px;
      padding: 2px 8px; margin-bottom: 6px; letter-spacing: 0.04em;
    }
    ul { margin: 4px 0 0; padding-left: 1.1rem; color: #c5d0de; font-size: 0.92rem; }
    .judgment ul { color: #e6d3a8; }
    .meta {
      margin-top: 12px; font-size: 0.8rem; color: var(--muted);
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); padding: 32px 8px; text-align: center; }
    footer {
      max-width: 760px; margin: 0 auto; padding: 0 20px 40px;
      color: var(--muted); font-size: 0.75rem;
    }
    @media (max-width: 480px) {
      header, main, footer { padding-left: 14px; padding-right: 14px; }
      .title { font-size: 0.98rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Radar</h1>
    <div class="sub">
      A 级信源按日归档 · 北京时间 08:00 / 13:30 ·
      <span id="updated">尚未拉取</span> ·
      <a href="./feed.xml">RSS</a>
    </div>
    <div class="note">
      看板展示<strong>近几日</strong>精选（约 7 天 / 最多约 50 条）。客观摘要只写事实；带琥珀色标记的是「主观判断」，勿当作事实。更早日期可从下方归档选择加载。
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="发布">发布</button>
      <button class="chip" data-filter="论文">论文</button>
      <button class="chip" data-filter="评测">评测</button>
      <button class="chip" data-filter="观点">观点</button>
      <button class="chip" data-filter="工具">工具</button>
      <button class="chip" data-filter="行业">行业</button>
      <button class="chip" data-filter="P0">仅 P0</button>
    </div>
    <div class="day-nav">
      <label for="archiveSelect">归档日期</label>
      <select id="archiveSelect">
        <option value="board">看板（近期合并）</option>
      </select>
    </div>
  </header>
  <main id="feed"><div class="empty">加载中…</div></main>
  <footer>免费静态页 · 原文均链到 X · 由 Alba 监控生成 · 客观摘要 ≠ 主观判断</footer>
  <script>
    const state = { filter: 'all', mode: 'board', items: [], archiveIndex: [] };

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function objectiveOf(it) {
      if (it.objective && it.objective.length) return it.objective;
      return it.bullets || [];
    }

    function judgmentOf(it) {
      return it.judgment || [];
    }

    function weekdayCN(dateStr) {
      const d = new Date(dateStr + 'T12:00:00+08:00');
      const map = ['日', '一', '二', '三', '四', '五', '六'];
      return '周' + map[d.getDay()];
    }

    function renderCard(it) {
      const obj = objectiveOf(it);
      const jud = judgmentOf(it);
      const label = it.judgment_label || '主观判断';
      const objHtml = obj.length
        ? `<div class="section objective"><div class="section-label">客观摘要</div><ul>${obj.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`
        : '';
      const judHtml = jud.length
        ? `<div class="judgment"><span class="badge">${esc(label)}</span><ul>${jud.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`
        : '';
      return `<article class="card ${it.priority === 'P0' ? 'p0' : ''}">
        <div>
          <span class="tag">${esc(it.tag || '动态')}</span>
          ${it.priority === 'P0' ? '<span class="tag p0">P0</span>' : ''}
        </div>
        <div class="title">${esc(it.title || '')}</div>
        ${objHtml}
        ${judHtml}
        <div class="meta">
          <span>@${esc(it.handle || '')}</span>
          <span>${esc(it.time || '')}</span>
          ${it.date ? `<span>${esc(it.date)}</span>` : ''}
          ${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">打开原文 ↗</a>` : ''}
        </div>
      </article>`;
    }

    function groupByDate(list) {
      const map = new Map();
      for (const it of list) {
        const d = it.date || '未知日期';
        if (!map.has(d)) map.set(d, []);
        map.get(d).push(it);
      }
      return [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));
    }

    function applyFilter(list) {
      const f = state.filter;
      return list.filter(it => {
        if (f === 'all') return true;
        if (f === 'P0') return it.priority === 'P0';
        return it.tag === f;
      });
    }

    function render() {
      const feed = document.getElementById('feed');
      const filtered = applyFilter(state.items);
      if (!filtered.length) {
        feed.innerHTML = '<div class="empty">这一筛选项下暂无内容。</div>';
        return;
      }
      const groups = groupByDate(filtered);
      feed.innerHTML = groups.map(([date, items]) => `
        <section class="day-block" id="day-${esc(date)}">
          <div class="day-header">
            <span>${esc(date)} · ${weekdayCN(date)}</span>
            <span class="count">${items.length} 条</span>
          </div>
          ${items.map(renderCard).join('')}
        </section>
      `).join('');
    }

    async function loadBoard() {
      const res = await fetch('./items.json?' + Date.now());
      if (!res.ok) throw new Error('items');
      const data = await res.json();
      state.items = Array.isArray(data) ? data : (data.items || []);
      if (data.updated) document.getElementById('updated').textContent = data.updated;
      state.mode = 'board';
      render();
    }

    async function loadArchiveIndex() {
      try {
        const res = await fetch('./archive/index.json?' + Date.now());
        if (!res.ok) return;
        const data = await res.json();
        state.archiveIndex = data.dates || [];
        const sel = document.getElementById('archiveSelect');
        for (const d of state.archiveIndex) {
          const opt = document.createElement('option');
          opt.value = d.date;
          opt.textContent = `${d.date}（${d.count} 条）`;
          sel.appendChild(opt);
        }
      } catch (e) {}
    }

    async function loadArchiveDay(date) {
      const res = await fetch('./archive/' + date + '.json?' + Date.now());
      if (!res.ok) throw new Error('archive');
      const data = await res.json();
      state.items = data.items || [];
      state.mode = date;
      document.getElementById('updated').textContent = '归档 ' + date;
      render();
    }

    document.getElementById('chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      state.filter = btn.dataset.filter;
      render();
    });

    document.getElementById('archiveSelect').addEventListener('change', async (e) => {
      const v = e.target.value;
      try {
        if (v === 'board') await loadBoard();
        else await loadArchiveDay(v);
      } catch (err) {
        document.getElementById('feed').innerHTML = '<div class="empty">加载失败，请稍后重试。</div>';
      }
    });

    (async () => {
      try {
        await loadBoard();
        await loadArchiveIndex();
      } catch (e) {
        document.getElementById('feed').innerHTML = '<div class="empty">还没有卡片。等早报/主报跑起来后这里会自动更新。</div>';
      }
    })();
  </script>
</body>
</html>
