  <div class="app">
    <script src="./assets/safe-href.js"></script>

    <div class="content">
      <main id="main">
        <h1>信息精选</h1>
        <p class="sub">按天往下看，新的一天在最上面。每一天只放通过精选的几条，更早的日子仍留在下面。事实简讯在<a href="./briefs.html">信息简讯</a>，两边不会重复。标成优先看的，是这天最该拍板的；标成尚待核实的，影响可能很大，原文还没核完。北京时间每天 08:00 主报，工作日 21:00 晚班。 <span id="updated"></span></p>
        <div class="day-jump">
          <label for="dayJump">时间筛选</label>
          <select id="dayJump"></select>
          <button class="btn" type="button" id="copyToday">复制最新一天</button>
        </div>
        <pre id="today3fallback" hidden></pre>
        <div id="feed"><p class="empty">正在读取…</p></div>
        <footer class="site-footer">
          <p>内容可能包含未经证实的传闻与第三方帖子，请自行核对。</p>
          <p>更正与下架：请通过「<a href="https://my.feishu.cn/share/base/form/shrcnEpIGDXepmIOFwMD8QUARwd" target="_blank" rel="noopener noreferrer">反馈 / 建议</a>」告知。</p>
        </footer>
      </main>
    </div>
