<!DOCTYPE html>
<html lang="zh-CN" data-page="tools">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-IOKTMj2PwDVQ60yH8bhcQvfXZPfT0arSeKPqq+PtA94=' https://static.cloudflareinsights.com; script-src-attr 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F1110" />
  <title>可试用工具 · AI Radar</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./assets/radar.css" />
</head>
<body>
  <div class="app">
    <script src="./assets/safe-href.js"></script>
    <script src="./assets/shell.js"></script>
    <div class="content">
      <main id="main">
        <h1>可试用工具</h1>
        <p class="sub">按你现在该怎么对待来分，不按热度排。 <span id="updated"></span></p>
        <div class="tool-grid" id="grid"><p class="empty">正在读取…</p></div>
        <p class="fine">点进去用一次真实任务，再决定留不留。</p>
      </main>
    </div>
  </div>
  <script src="./assets/cards.js"></script>
  <script>
    const rings = [
      ["采纳", "值得用上", "现在就可以放进你的流程。", ""],
      ["试用", "可以试", "本周用一次真实任务摸清楚。", ""],
      ["评估", "先评估", "先看成本和边界，不必马上用。", "assess"],
      ["暂缓", "先别跟", "先观察，不据此改做法。", "hold"]
    ];

    fetch("./tools-radar.json?" + Date.now())
      .then((res) => res.json())
      .then((data) => {
        if (data.updated) document.getElementById("updated").textContent = "最近更新 " + data.updated;
        const groups = data.rings || {};
        document.getElementById("grid").innerHTML = rings.map(([key, title, hint, dot]) => {
          const list = groups[key] || [];
          const body = list.length
            ? list.map((it) => {
                const href = Radar.safeHref(it.try_url || it.url || "");
                const titleHtml = href
                  ? `<a href="${Radar.esc(href)}" target="_blank" rel="noopener">${Radar.esc(it.title)}</a>`
                  : Radar.esc(it.title);
                const bits = [it.access, it.integration].filter(Boolean).map(Radar.esc);
                const step = it.first_step ? `<div>第一步：${Radar.esc(it.first_step)}</div>` : "";
                return `<div class="tool-item"><div>${titleHtml}</div><div class="meta">${bits.join(" · ")}${step}</div></div>`;
              }).join("")
            : '<p class="empty">这一档还没有。</p>';
          return `<section class="card ring"><h2><span class="ring-dot ${dot}"></span>${title}</h2><p class="hint">${hint}</p>${body}</section>`;
        }).join("");
      })
      .catch(() => {
        document.getElementById("grid").innerHTML = '<p class="empty">暂时读不到工具列表。</p>';
      });
  </script>
</body>
</html>
