<!DOCTYPE html>
<html lang="zh-CN" data-page="practice">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-W2GHfTab+/0bh2KYlEV2PTYeViwGk1eFwJLCWDgyiZk=' https://static.cloudflareinsights.com; script-src-attr 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F1110" />
  <title>做法条目 · 实战手册 · AI Radar</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./assets/radar.css" />
</head>
<body>
  <div class="app">
    <script src="./assets/safe-href.js"></script>
    <script src="./assets/shell.js"></script>
    <div class="content">
      <main id="main">
        <h1>做法条目</h1>
        <p class="sub">这一页是<a href="./atlas.html">实战手册</a>里的做法全文。本页收录编辑精选、每周投放的实操，每条都写清步骤和开始前要准备什么，收的是可照着做的用法、创意、变现和工作流。同一条也会进入对应的主题手册。作者索引在<a href="./creators.html">博主库</a>。</p>
        <div class="filters" id="kindFilters">
          <button class="chip on" type="button" data-kind="all">全部</button>
          <button class="chip" type="button" data-kind="工具用法">工具用法</button>
          <button class="chip" type="button" data-kind="创意作品">创意作品</button>
          <button class="chip" type="button" data-kind="变现">变现</button>
          <button class="chip" type="button" data-kind="Skill / 工作流">Skill / 工作流</button>
          <button class="chip" type="button" data-kind="硬件">硬件</button>
        </div>
        <div id="list"><p class="empty">正在读取…</p></div>
      </main>
    </div>
  </div>
  <script src="./assets/cards.js"></script>
  <script>
    const state = { kind: "all", items: [] };

    function practiceFacts(it) {
      const bits = [];
      if (it.difficulty) bits.push(Radar.esc(it.difficulty));
      if (it.estimated_time) bits.push(Radar.esc(it.estimated_time));
      if (it.verified === true) bits.push("已对照原文");
      if (it.verified === false) bits.push("步骤未复核");
      if (it.author) bits.push(Radar.esc(it.author));
      if (it.time) bits.push(Radar.esc(it.time));
      return bits.map((bit) => `<span>${bit}</span>`).join('<span>·</span>');
    }

    const topicsBySource = {};

    function topicLink(it) {
      const hit = topicsBySource[it.id];
      if (!hit) return "";
      const href = Radar.safeHref("./topics/" + hit.slug + ".html");
      if (!href) return "";
      return `<p class="mean"><b>收入主题：</b><a href="${Radar.esc(href)}">${Radar.esc(hit.name)}</a></p>`;
    }

    function renderPractice(it) {
      const steps = Array.isArray(it.steps) ? it.steps.filter(Boolean) : [];
      const needs = Array.isArray(it.prerequisites) ? it.prerequisites.filter(Boolean) : [];
      const href = Radar.safeHref(it.url);
      const fold = [
        steps.length ? `<ol>${steps.map((s) => `<li>${Radar.esc(s)}</li>`).join("")}</ol>` : "",
        it.caution ? `<p>${Radar.esc(it.caution)}</p>` : "",
        href ? `<p><a href="${Radar.esc(href)}" target="_blank" rel="noopener">打开原文</a></p>` : ""
      ].join("");
      const details = fold.trim()
        ? `<details><summary>步骤摘要</summary><div class="fold">${fold}</div></details>`
        : "";
      const before = needs.length
        ? `<p class="mean"><b>开始前：</b>${Radar.esc(needs.join("；"))}</p>`
        : "";
      return `<article class="card" id="${Radar.esc(it.id || "")}">
        <div class="meta">
          <span class="tag prac">${Radar.esc(it.kind || "实操")}</span>
          ${practiceFacts(it)}
        </div>
        <h3>${Radar.esc(it.title || "")}</h3>
        ${it.takeaway ? `<p class="mean"><b>可借鉴点：</b>${Radar.esc(it.takeaway)}</p>` : ""}
        ${topicLink(it)}
        ${before}
        ${details}
      </article>`;
    }

    function render() {
      const list = state.items.filter((it) => state.kind === "all" || it.kind === state.kind);
      const host = document.getElementById("list");
      host.className = "";
      if (!state.items.length) {
        host.innerHTML = state.kind === "all"
          ? '<p class="empty">还没有可照着做的实操。</p>'
          : '<p class="empty">这一类下面还没有。</p>';
        return;
      }
      if (!list.length) {
        host.innerHTML = '<p class="empty">这一类下面还没有。</p>';
        return;
      }
      if (list.length > 1) host.className = "two-col";
      host.innerHTML = list.map(renderPractice).join("");
    }

    document.getElementById("kindFilters").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-kind]");
      if (!btn) return;
      document.querySelectorAll("#kindFilters .chip").forEach((el) => el.classList.remove("on"));
      btn.classList.add("on");
      state.kind = btn.dataset.kind;
      render();
    });

    (async () => {
      const sample = new URLSearchParams(location.search).get("sample") === "1";
      const url = sample ? "./practice.sample.json" : "./practice.json";
      try {
        const [res, kbRes] = await Promise.all([
          fetch(url + "?" + Date.now()),
          fetch("./data/kb.json?" + Date.now())
        ]);
        if (!res.ok) throw new Error("practice");
        const data = await res.json();
        state.items = data.items || [];
        if (kbRes.ok) {
          const kb = await kbRes.json();
          const names = {};
          (kb.topics || []).forEach((topic) => { names[topic.slug] = topic.name; });
          (kb.sources || []).forEach((source) => {
            if (source.origin === "practice" && names[source.topic]) {
              topicsBySource[source.id] = { slug: source.topic, name: names[source.topic] };
            }
          });
        }
        render();
        if (sample && state.items.length) {
          const note = document.createElement("p");
          note.className = "fine";
          note.textContent = "正在看版式示例，不是已入库的实操。";
          document.getElementById("list").before(note);
        }
      } catch (err) {
        document.getElementById("list").innerHTML = '<p class="empty">暂时读不到实操列表。</p>';
      }
    })();
  </script>
</body>
</html>
