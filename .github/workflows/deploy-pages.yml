# Canonical Pages deploy. Publishes public/ only.
# Pages Source is GitHub Actions (build_type=workflow). Root mirrors are retired via .no-root-mirror.
name: Deploy Pages · public/

on:
  push:
    branches: [main]
  # today3 / the 7-day board / the weekly memo are windowed on the Beijing date, so
  # rebuild once a day even when nothing was pushed. 16:10 UTC = 00:10 Beijing.
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: pip install -r requirements-ci.txt
      - name: Derive + validate
        env:
          VALIDATE_BASE_SHA: ${{ github.event.before }}
        run: |
          python3 scripts/generate_derived.py
          python3 scripts/score_sources.py
          python3 scripts/generate_weekly_memo.py
          python3 scripts/validate.py
      - name: Ensure .nojekyll
        run: touch public/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Pages source = GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type || true)
          echo "pages build_type=${build:-unknown}"
          if [ "$build" != "workflow" ]; then
            echo "::error::Pages build_type is '${build:-unknown}', not workflow. Settings → Pages → Source must be GitHub Actions. This workflow deploys public/ only; root mirrors are retired (.no-root-mirror)."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
