# Watch-list X posts → private pool. Public pull-request CI does not run this file.
# Schedule is UTC 00:00 daily and 13:00 Mon–Fri = 08:00 daily and 21:00 weekdays
# Asia/Shanghai. GitHub's schedule can lag; workflow_dispatch is the reliable
# entry. A Cloudflare Workers Cron (not deployed here) or any HTTPS client can
# POST that dispatch. See docs/score-and-briefs.md.
# RSS denser cadence is intentional; this X Actions schedule stays 2×/day until Bearer is primary.
# Secrets, both optional until configured:
#   AI_RADAR_POOL_TOKEN  fine-grained PAT, Contents read/write on ai-radar-pool only
#   X_BEARER_TOKEN       X API bearer. Absent → skip live fetch; hand-feed still works
# Each secret is only in the env of the step that needs it.
# GITHUB_TOKEN only pushes the rolling briefs branch (chore/auto-briefs)
# and opens or updates its pull request. It does not push main.
# Pages: deploy-pages.yml still runs on push to main, after that PR is merged.
# Never commit the raw fetch or pool JSONL.
# X posts never reach auto_brief (score_pool review_not_official), so a run here
# usually changes only the private pool and the review list.
name: Ingest X watch into private pool

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "live 需要 X_BEARER_TOKEN；skip 只确认骨架，不抓取"
        type: choice
        options:
          - live
          - skip
        default: live

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pool-writer
  cancel-in-progress: false

jobs:
  ingest-x-pool:
    runs-on: ubuntu-latest
    # The pool must sit beside the public checkout, not inside it (assert_shift_pool_dir).
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout public scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check tokens
        id: gate
        env:
          MODE: ${{ github.event.inputs.mode }}
          HAS_POOL_TOKEN: ${{ secrets.AI_RADAR_POOL_TOKEN != '' }}
          HAS_X_TOKEN: ${{ secrets.X_BEARER_TOKEN != '' }}
        run: |
          if [ "${MODE}" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "mode=skip：不抓取，不写池。"
            exit 0
          fi
          if [ "${HAS_POOL_TOKEN}" != "true" ]; then
            echo "::warning::AI_RADAR_POOL_TOKEN 未配置。不写私有池。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${HAS_X_TOKEN}" != "true" ]; then
            echo "::warning::X_BEARER_TOKEN 未配置。定时抓取未打开。手灌仍走 scripts/shift_ingest_x_to_pool.py --fetch。见 docs/x-pool-ingest.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install JSON Schema validator
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements-ci.txt

      - name: Checkout private pool
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruiyaoe-hash/ai-radar-pool
          token: ${{ secrets.AI_RADAR_POOL_TOKEN }}
          path: pool
          persist-credentials: false

      - name: Fetch X watch list
        id: fetch
        if: steps.gate.outputs.skip != 'true'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set +e
          python3 scripts/fetch_x_watch.py --out "${RUNNER_TEMP}/x-fetch.json" --state ../pool/state/x-since.json
          code=$?
          set -e
          # 2 = some accounts failed or were rate limited; what came back is still ingested.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "FAIL: X fetch exit ${code}"
            exit 1
          fi
          echo "partial=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Ingest, score, derive briefs
        if: steps.gate.outputs.skip != 'true'
        run: |
          set +e
          python3 scripts/shift_ingest_x_to_pool.py --fetch "${RUNNER_TEMP}/x-fetch.json" --pool-dir ../pool
          code=$?
          set -e
          rm -f "${RUNNER_TEMP}/x-fetch.json"
          if [ "$code" -eq 1 ]; then
            echo "FAIL: X ingest failed"
            exit 1
          fi
          python3 scripts/score_pool.py --pool-dir ../pool --write-review
          python3 scripts/project_public_lanes.py --pool-dir ../pool
          python3 scripts/derive_briefs.py --pool-dir ../pool --briefs public/briefs.json
          python3 scripts/generate_derived.py

      - name: Push private pool only
        if: steps.gate.outputs.skip != 'true'
        working-directory: pool
        env:
          COMMIT_MESSAGE: "ingest: X watch candidates"
          POOL_TOKEN: ${{ secrets.AI_RADAR_POOL_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/site/scripts/pool_git_push.sh" candidates review state

      - name: Validate and open briefs pull request
        id: briefs
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POOL_DIR: ../pool
        run: bash scripts/public_briefs_push.sh

      - name: Flag a partial fetch
        if: steps.fetch.outputs.partial == 'true'
        run: |
          echo "::error::部分账号抓取失败或被限流。已抓到的已入池；看上面 fetch_x_watch 的日志。"
          exit 1
