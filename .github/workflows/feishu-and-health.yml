# Formal P0 push + 24h silence alert. Secret name: FEISHU_BOT_WEBHOOK (unset = dry-run, job stays green).
name: Feishu P0 + 24h health

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/archive/**"

permissions:
  contents: read
  actions: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Restore notify state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .feishu-notify-state.json
          key: feishu-notify-${{ github.run_id }}
          restore-keys: |
            feishu-notify-

      - name: Notify formal P0 + health check
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_STATE_PATH: .feishu-notify-state.json
        run: python3 scripts/feishu_notify.py

      - name: Save notify state
        if: always() && hashFiles('.feishu-notify-state.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .feishu-notify-state.json
          key: feishu-notify-${{ github.run_id }}
