# Batch-1 lab RSS → private pool only. Public CI does not run this file.
# Cron is UTC: 00:30, 06:30, 12:30 = 08:30, 14:30, 20:30 Asia/Shanghai (3×/day).
# GitHub's schedule can lag. An external cron (Cloudflare Workers Cron or any
# HTTPS client) may POST workflow_dispatch instead. This repo does not deploy
# that Worker. See docs/score-and-briefs.md.
# Secret AI_RADAR_POOL_TOKEN: fine-grained PAT, Contents read/write on
# ruiyaoe-hash/ai-radar-pool only. Do not grant it write access to public ai-radar.
# GITHUB_TOKEN below only pushes public/briefs.json. Missing pool secret: warn and exit 0.
# Never push pool JSONL to the public repo.
name: Ingest RSS into private pool

on:
  schedule:
    - cron: "30 0,6,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-rss-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check pool token
        id: token
        env:
          AI_RADAR_POOL_TOKEN: ${{ secrets.AI_RADAR_POOL_TOKEN }}
        run: |
          if [ -z "${AI_RADAR_POOL_TOKEN}" ]; then
            echo "::warning::AI_RADAR_POOL_TOKEN is unset. Soft-fail. Add a fine-grained PAT scoped only to ruiyaoe-hash/ai-radar-pool (Contents read and write). Public CI is unchanged."
            echo "AI_RADAR_POOL_TOKEN 未配置。软失败：不拉取 RSS，不写私有池，也不动公开仓。公开 CI 不依赖这枚密钥。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private pool
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ruiyaoe-hash/ai-radar-pool
          token: ${{ secrets.AI_RADAR_POOL_TOKEN }}
          path: pool
          persist-credentials: true

      - name: Ingest batch 1, annotate, score, derive briefs
        if: steps.token.outputs.skip != 'true'
        run: |
          set +e
          python3 scripts/ingest_rss.py --pool-dir pool --sources public/config/sources.json
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "FAIL: every batch-1 feed failed"
            exit 1
          fi
          # Exit 2 means some items had no link (FETCH_GAP). Rows that parsed are still on disk.
          python3 scripts/annotate_gates.py --pool-dir pool --only-pending
          python3 scripts/score_pool.py --pool-dir pool --write-review
          python3 scripts/derive_briefs.py --pool-dir pool --briefs public/briefs.json

      - name: Push private pool only
        if: steps.token.outputs.skip != 'true'
        working-directory: pool
        env:
          COMMIT_MESSAGE: "ingest: RSS batch1 candidates"
        run: bash "$GITHUB_WORKSPACE/scripts/pool_git_push.sh" candidates review

      - name: Push public briefs
        if: steps.token.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/public_briefs_push.sh
